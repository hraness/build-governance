# Reusable: lint captured CLI help, check captured --json output against desktop-foundation's control
# grammar and envelope, and fail on menu bar or tray code, with hraness-copy-lint.
# Advisory by default: findings become warnings on the pull request and never fail the caller.
name: CLI copy and control

on:
  workflow_call:
    inputs:
      mode:
        description: "advisory (warn, never fail) or required (fail on findings)"
        type: string
        default: advisory
      bare-golden:
        description: "Captured output of the CLI run with no arguments (25-line budget)"
        type: string
        default: ""
      help-golden:
        description: "Captured root --help output (60-line budget)"
        type: string
        default: ""
      command-goldens:
        description: "Globs of captured <command> --help output, one per line"
        type: string
        default: ""
      commands-json:
        description: "Captured <product> commands --json, checked against the shared verb grammar"
        type: string
        default: ""
      status-json:
        description: "Captured <product> status --json, checked against the envelope schema"
        type: string
        default: ""
      tui-json:
        description: "Captured <product> tui --json, which must match status-json except generatedAt"
        type: string
        default: ""
      envelopes:
        description: "Globs of other captured --json output, such as errors, one per line"
        type: string
        default: ""
      tray:
        description: "Fail on menu bar or tray code, such as a menu-kit import (true or false)"
        type: string
        default: "true"
      tray-exclude:
        description: "Globs the tray guard skips, one per line, relative to the repository root (not working-directory)"
        type: string
        default: ""
      proper-nouns:
        description: "Names help may capitalize, comma-separated"
        type: string
        default: ""
      config:
        description: "A public-copy.config.json with cli, control and tray sections, used instead of the inputs above"
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      menu-fixtures:
        description: "Removed in 0.5.0 with the menu checks. Fails when set."
        type: string
        default: ""
      use-checkout:
        description: "Use the checked-out repository as build-governance. Only for build-governance's own CI."
        type: boolean
        default: false
      governance-ref:
        description: "build-governance tag or branch that provides the lint"
        type: string
        default: v0.5.2

permissions:
  contents: read

jobs:
  copy:
    name: CLI copy and control (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode == 'advisory' }}
    steps:
      - name: Check the mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in advisory|required) ;; *) echo "::error::mode must be advisory or required, not \"$MODE\"."; exit 2 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: ${{ github.ref != 'refs/heads/main' }}
      - name: Get the lint
        env:
          REF: ${{ inputs.governance-ref }}
          USE_CHECKOUT: ${{ inputs.use-checkout }}
        run: |
          set -euo pipefail
          if [[ "$USE_CHECKOUT" == true ]]; then
            echo "GOVERNANCE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi
          git clone --quiet --depth 1 --branch "$REF" https://github.com/hraness/build-governance.git "$RUNNER_TEMP/build-governance"
          echo "GOVERNANCE=$RUNNER_TEMP/build-governance" >> "$GITHUB_ENV"
      - name: Write the lint config
        if: inputs.config == ''
        env:
          MENU_FIXTURES: ${{ inputs.menu-fixtures }}
          COMMANDS_JSON: ${{ inputs.commands-json }}
          STATUS_JSON: ${{ inputs.status-json }}
          TUI_JSON: ${{ inputs.tui-json }}
          ENVELOPES: ${{ inputs.envelopes }}
          TRAY: ${{ inputs.tray }}
          TRAY_EXCLUDE: ${{ inputs.tray-exclude }}
          BARE_GOLDEN: ${{ inputs.bare-golden }}
          HELP_GOLDEN: ${{ inputs.help-golden }}
          COMMAND_GOLDENS: ${{ inputs.command-goldens }}
          PROPER_NOUNS: ${{ inputs.proper-nouns }}
        run: |
          set -euo pipefail
          bun "$GOVERNANCE/src/ux-copy-config.ts" > "$RUNNER_TEMP/ux-copy.config.json"
          cat "$RUNNER_TEMP/ux-copy.config.json"
          echo "COPY_CONFIG=$RUNNER_TEMP/ux-copy.config.json" >> "$GITHUB_ENV"
      - name: Use the repository's config
        if: inputs.config != ''
        env:
          CONFIG: ${{ inputs.config }}
        run: echo "COPY_CONFIG=$CONFIG" >> "$GITHUB_ENV"
      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -uo pipefail
          args=(--root . --config "$COPY_CONFIG" --only "cli,control,tray" --annotations)
          if [[ "$MODE" == advisory ]]; then args+=(--advisory); fi
          bun "$GOVERNANCE/src/public-copy-cli.ts" "${args[@]}" | tee "$RUNNER_TEMP/copy.log"
          status=${PIPESTATUS[0]}
          {
            echo "### CLI copy and control ($MODE)"
            echo
            grep -E '^hraness-public-copy/' "$RUNNER_TEMP/copy.log" || true
            if [[ "$MODE" == advisory ]]; then echo; echo "Advisory: findings show as warnings and do not fail the job."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
