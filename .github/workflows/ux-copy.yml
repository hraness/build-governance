# Reusable: lint captured CLI help and menu snapshot fixtures with hraness-copy-lint.
# Menu fixtures are checked by desktop-foundation's own `companion lint-menu --strict`.
# Advisory by default: findings become warnings on the pull request and never fail the caller.
name: CLI and menu copy

on:
  workflow_call:
    inputs:
      mode:
        description: "advisory (warn, never fail) or required (fail on findings)"
        type: string
        default: advisory
      menu-fixtures:
        description: "Globs of v2 menu snapshot fixtures, one per line"
        type: string
        default: ""
      bare-golden:
        description: "Captured output of the CLI run with no arguments (25-line budget)"
        type: string
        default: ""
      help-golden:
        description: "Captured root --help output (60-line budget)"
        type: string
        default: ""
      command-goldens:
        description: "Globs of captured <command> --help output, one per line"
        type: string
        default: ""
      proper-nouns:
        description: "Names help and menus may capitalize, comma-separated"
        type: string
        default: ""
      config:
        description: "A public-copy.config.json with cli and menus sections, used instead of the inputs above"
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      desktop-foundation:
        description: "desktop-foundation release tag whose lint-menu checks the fixtures"
        type: string
        default: v0.8.0
      desktop-foundation-sha256:
        description: "SHA-256 of that release's SDK tarball. Change it with the tag."
        type: string
        default: 0f6378ef34f42d56df818cfba285547fd71a6f9de556156bb42110013e6ca191
      governance-ref:
        description: "build-governance tag or branch that provides the lint"
        type: string
        default: v0.3.0

permissions:
  contents: read

jobs:
  copy:
    name: CLI and menu copy (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'required' }}
    steps:
      - name: Check the mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in advisory|required) ;; *) echo "::error::mode must be advisory or required, not \"$MODE\"."; exit 2 ;; esac
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Get the lint
        env:
          REF: ${{ inputs.governance-ref }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$REF" https://github.com/hraness/build-governance.git "$RUNNER_TEMP/build-governance"
          echo "GOVERNANCE=$RUNNER_TEMP/build-governance" >> "$GITHUB_ENV"
      - name: Get desktop-foundation's menu lint
        if: inputs.menu-fixtures != '' || inputs.config != ''
        env:
          TAG: ${{ inputs.desktop-foundation }}
          SHA256: ${{ inputs.desktop-foundation-sha256 }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dir="$RUNNER_TEMP/desktop-foundation"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/sdk.tgz" "https://github.com/hraness/desktop-foundation/releases/download/$TAG/hraness-desktop-foundation-$version.tgz"
          echo "$SHA256  $dir/sdk.tgz" | sha256sum --check --status || { echo "::error::The desktop-foundation $TAG tarball does not match desktop-foundation-sha256. Update both inputs together."; exit 2; }
          tar -xzf "$dir/sdk.tgz" -C "$dir"
          echo "MENU_KIT=$dir/package" >> "$GITHUB_ENV"
      - name: Write the lint config
        if: inputs.config == ''
        env:
          MENU_FIXTURES: ${{ inputs.menu-fixtures }}
          BARE_GOLDEN: ${{ inputs.bare-golden }}
          HELP_GOLDEN: ${{ inputs.help-golden }}
          COMMAND_GOLDENS: ${{ inputs.command-goldens }}
          PROPER_NOUNS: ${{ inputs.proper-nouns }}
        run: |
          set -euo pipefail
          bun "$GOVERNANCE/src/ux-copy-config.ts" > "$RUNNER_TEMP/ux-copy.config.json"
          cat "$RUNNER_TEMP/ux-copy.config.json"
          echo "COPY_CONFIG=$RUNNER_TEMP/ux-copy.config.json" >> "$GITHUB_ENV"
      - name: Use the repository's config
        if: inputs.config != ''
        env:
          CONFIG: ${{ inputs.config }}
        run: echo "COPY_CONFIG=$CONFIG" >> "$GITHUB_ENV"
      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -uo pipefail
          args=(--root . --config "$COPY_CONFIG" --only "cli,menus" --annotations)
          if [[ -n "${MENU_KIT:-}" ]]; then args+=(--menu-kit "$MENU_KIT"); fi
          if [[ "$MODE" == advisory ]]; then args+=(--advisory); fi
          bun "$GOVERNANCE/src/public-copy-cli.ts" "${args[@]}" | tee "$RUNNER_TEMP/copy.log"
          status=${PIPESTATUS[0]}
          {
            echo "### CLI and menu copy ($MODE)"
            echo
            grep -E '^hraness-public-copy/' "$RUNNER_TEMP/copy.log" || true
            if [[ "$MODE" == advisory ]]; then echo; echo "Advisory: findings show as warnings and do not fail the job."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
