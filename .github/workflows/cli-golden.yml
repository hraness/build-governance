# Reusable: build a CLI and run hraness-cli-golden over it (the CLI style guide's D2 to D8 checks:
# bare invocation, --help, <command> --help, --version, an unknown command, --json and agent
# errors, NO_COLOR on a terminal, TERM=dumb, pipes). Advisory by default: problems become
# warnings on the pull request and never fail the caller.
name: CLI golden checks

on:
  workflow_call:
    inputs:
      cli:
        description: 'The built CLI to run, such as "./target/release/xcb" or "bun src/cli.ts"'
        type: string
        required: true
      name:
        description: "The name --version prints (default: from the command)"
        type: string
        default: ""
      commands:
        description: 'Comma-separated commands to check with --help, such as "setup,status,chats add"'
        type: string
        default: ""
      unknown:
        description: "A command that does not exist"
        type: string
        default: stauts
      build:
        description: "Shell command that builds the CLI, run in working-directory"
        type: string
        default: ""
      setup:
        description: "Toolchains to install besides Bun, comma-separated: node, rust"
        type: string
        default: ""
      node-version:
        type: string
        default: "24"
      rust-toolchain:
        type: string
        default: stable
      env:
        description: "Extra environment for every run of the CLI, one NAME=value per line"
        type: string
        default: ""
      proper-nouns:
        description: "Names help may capitalize, comma-separated"
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      runs-on:
        type: string
        default: ubuntu-latest
      mode:
        description: "advisory (warn, never fail) or required (fail on problems)"
        type: string
        default: advisory
      use-checkout:
        description: "Use the checked-out repository as build-governance. Only for build-governance's own CI."
        type: boolean
        default: false
      governance-ref:
        description: "build-governance tag or branch that provides the harness"
        type: string
        default: v0.5.2

permissions:
  contents: read

jobs:
  golden:
    name: CLI golden checks (${{ inputs.mode }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    continue-on-error: ${{ inputs.mode == 'advisory' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in advisory|required) ;; *) echo "::error::mode must be advisory or required, not \"$MODE\"."; exit 2 ;; esac
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: ${{ github.ref != 'refs/heads/main' }}
      # The caller's default branch saves the Bun cache; pull requests only restore it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref != 'refs/heads/main'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: contains(inputs.setup, 'node')
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: contains(inputs.setup, 'rust')
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: contains(inputs.setup, 'rust')
        with:
          workspaces: ${{ inputs.working-directory }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the CLI
        if: inputs.build != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD: ${{ inputs.build }}
        run: bash -euo pipefail -c "$BUILD"
      - name: Get the harness
        env:
          REF: ${{ inputs.governance-ref }}
          USE_CHECKOUT: ${{ inputs.use-checkout }}
        run: |
          set -euo pipefail
          if [[ "$USE_CHECKOUT" == true ]]; then
            echo "GOVERNANCE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi
          git clone --quiet --depth 1 --branch "$REF" https://github.com/hraness/build-governance.git "$RUNNER_TEMP/build-governance"
          echo "GOVERNANCE=$RUNNER_TEMP/build-governance" >> "$GITHUB_ENV"
      - name: Run the golden checks
        working-directory: ${{ inputs.working-directory }}
        env:
          CLI: ${{ inputs.cli }}
          NAME: ${{ inputs.name }}
          COMMANDS: ${{ inputs.commands }}
          UNKNOWN: ${{ inputs.unknown }}
          EXTRA_ENV: ${{ inputs.env }}
          PROPER_NOUNS: ${{ inputs.proper-nouns }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          args=(--cli "$CLI" --unknown "$UNKNOWN" --write "$RUNNER_TEMP/cli-goldens" --annotations)
          if [[ -n "$NAME" ]]; then args+=(--name "$NAME"); fi
          if [[ -n "$COMMANDS" ]]; then args+=(--commands "$COMMANDS"); fi
          while IFS= read -r pair; do
            if [[ -n "$pair" ]]; then args+=(--env "$pair"); fi
          done <<< "$EXTRA_ENV"
          IFS=',' read -ra nouns <<< "$PROPER_NOUNS"
          for noun in "${nouns[@]}"; do
            noun="${noun#"${noun%%[![:space:]]*}"}"
            noun="${noun%"${noun##*[![:space:]]}"}"
            if [[ -n "$noun" ]]; then args+=(--proper-noun "$noun"); fi
          done
          if [[ "$MODE" == advisory ]]; then args+=(--advisory); fi
          bun "$GOVERNANCE/src/cli-golden-cli.ts" "${args[@]}"
      - name: Keep the captured output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-goldens-${{ inputs.name || 'cli' }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-goldens
          if-no-files-found: ignore
          retention-days: 7
