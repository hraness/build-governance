name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel superseded runs; every main push keeps its own run so main is never left unchecked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: ${{ github.ref != 'refs/heads/main' }}
      # Pull requests only restore the Bun cache; main saves it.
      - id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - run: bun run check
      - name: dist matches the source
        run: |
          set -euo pipefail
          bun run build
          status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error::dist is out of date. Run bun run build and commit dist."
            exit 1
          fi

      - name: The harness opens a pseudo-terminal on Linux
        run: |
          set -euo pipefail
          bun src/cli-golden-cli.ts --cli "bun src/cli-golden/fixtures/good-cli.ts" --name demo --json \
            | jq -e '.results[] | select(.id == "NO_COLOR") | .status == "pass"'
      - name: The harness catches every problem on Linux, and advisory mode still exits 0
        run: |
          set -euo pipefail
          bun src/cli-golden-cli.ts --cli "bun src/cli-golden/fixtures/bad-cli.ts" --name bad --commands status --advisory --json > "$RUNNER_TEMP/bad.json"
          jq -e '.ok == false and ([.results[] | select(.status == "pass")] | length) == 0' "$RUNNER_TEMP/bad.json"

  # The reusable workflows, called the way a product calls them, with the tools from this commit.
  golden-follows-contract:
    uses: ./.github/workflows/cli-golden.yml
    with:
      cli: bun src/cli-golden/fixtures/good-cli.ts
      name: demo
      commands: setup,status
      mode: required
      use-checkout: true

  golden-breaks-contract-advisory:
    uses: ./.github/workflows/cli-golden.yml
    with:
      cli: bun src/cli-golden/fixtures/bad-cli.ts
      name: bad
      commands: status
      mode: advisory
      use-checkout: true

  copy-follows-contract:
    uses: ./.github/workflows/ux-copy.yml
    with:
      working-directory: fixtures/ux
      bare-golden: help/bare.txt
      help-golden: help/help.txt
      command-goldens: help/*.help.txt
      commands-json: control/commands.json
      status-json: control/status.json
      tui-json: control/tui.json
      envelopes: control/errors/*.json
      proper-nouns: Demo
      mode: required
      use-checkout: true

  Required:
    if: always()
    needs: [check, golden-follows-contract, golden-breaks-contract-advisory, copy-follows-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every blocking job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' >/dev/null
